name: E2E tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "22.x"
          check-latest: true

      - name: Build wasm
        run: |
          cargo install wasm-pack
          cd sync_lib
          wasm-pack build --target web sync_lib

      - name: E2E tests
        run: |
          UST_BACKTRACE=1 cargo run -p sync_server &
          cd ..
          scripts/e2e.sh 32
