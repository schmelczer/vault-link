name: Deploy Documentation

on:
  push:
    branches:
      - "**"
    paths:
      - docs/**
      - .forgejo/workflows/deploy-docs.yml
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

          persist-credentials: false
      - name: Setup Node.js environment
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "25.x"

      - name: Build docs
        run: scripts/build-docs.sh

      - name: Upload artifact
        uses: https://github.com/actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs
          path: docs/.vitepress/dist
