name: Publish CLI

on:
  push:
    branches:
      - "**"
    tags:
      - "*"

jobs:
  publish-docker:
    runs-on: docker

    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and publish in rootless sandbox
        uses: https://git.schmelczer.dev/andras/ci-actions/docker-publish@10ab5db88c5f6fc1d2a368ce0ea934807f7ebfca
        with:
          context: frontend
          push: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
          token: ${{ ((github.ref == 'refs/heads/main' || github.ref_type == 'tag')) && secrets.GITHUB_TOKEN || '' }}
          dockerfile: frontend/local-client-cli/Dockerfile
          platforms: linux/amd64
          image-suffix: -cli
