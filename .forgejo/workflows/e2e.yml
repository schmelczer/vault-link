name: E2E tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: e2e-tests
  cancel-in-progress: false

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    runs-on: ${{ (github.actor == 'renovate-bot' || github.event.pull_request.user.login == 'renovate-bot' || startsWith(github.ref, 'refs/heads/renovate/') || startsWith(github.head_ref,
      'renovate/')) && 'renovate-ubuntu' || 'ubuntu-latest' }}

    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

          persist-credentials: false
      - name: Setup Node.js environment
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "25.x"

      - name: Setup Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.92.0"
          components: clippy, rustfmt

      - name: Setup rust
        run: |
          which sqlx || cargo install sqlx-cli
          cd sync-server
          sqlx database create --database-url sqlite://db.sqlite3
          sqlx migrate run --source src/app_state/database/migrations --database-url sqlite://db.sqlite3

      - name: E2E tests
        run: |
          cd sync-server
          cargo run config-e2e.yml --color never &
          SERVER_PID=$!
          cd ..

          scripts/e2e.sh 8
          EXIT_CODE=$?

          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          exit $EXIT_CODE

      - name: Upload e2e logs
        if: always()
        uses: https://github.com/actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-logs
          path: logs/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: scripts/clean-up.sh
    if: ${{ (github.event_name == 'schedule' || contains(fromJSON('["andras","ruby336688","renovate-bot"]'), github.actor)) && (!github.event.pull_request || contains(fromJSON('["andras","ruby336688","renovate-bot"]'),
      github.event.pull_request.user.login)) }}
