name: Publish Obsidian plugin

on:
  push:
    tags:
      - "*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-plugin:
    runs-on: ubuntu-latest

    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js environment
        uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 25.x
      - name: Build plugin
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Setup Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt
      - name: Install cross-compilation tools
        run: |
          apt update
          apt install -y gcc-aarch64-linux-gnu musl-tools gcc-mingw-w64-x86-64 jq
      - name: Build Linux and Windows binaries
        run: ./scripts/build-sync-server-binaries.sh
      - name: Get publishing token
        id: publishing
        if: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
        uses: https://git.schmelczer.dev/andras/ci-actions/forgejo-token@df65a1b2608eb58c5b8347a3afb71265e0fce794
        with:
          audience: ${{ vars.PUBLISH_AUDIENCE }}
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ (secrets.GITHUB_TOKEN || '') }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ steps.publishing.outputs.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          mkdir -p release
          cp frontend/obsidian-plugin/dist/* release/
          cp sync-server/artifacts/sync-server-* release/

          # Create draft release via Forgejo API
          RELEASE_ID=$(curl -s -X POST \
            "${SERVER_URL}/api/v1/repos/${REPO}/releases" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"${tag}\", \"name\": \"${tag}\", \"draft\": true}" \
            | jq -r '.id')

          # Upload release assets
          for file in release/*; do
            filename=$(basename "$file")
            curl -s -X POST \
              "${SERVER_URL}/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${filename}" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -F "attachment=@${file}"
          done
        if: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    if: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    enable-openid-connect: true
