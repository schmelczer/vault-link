name: Publish server Docker image

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  publish-docker:
    runs-on: docker

    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Build and publish in rootless sandbox
        uses: https://git.schmelczer.dev/andras/ci-actions/docker-publish@18419c79a58572be1bb3759b334f43306be44a29
        with:
          context: sync-server
          push: ${{ github.event_name != 'pull_request' && (github.ref_type == 'tag') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          platforms: linux/amd64,linux/arm64
    if: ${{ github.actor != 'renovate-bot' && !startsWith(github.ref, 'refs/heads/renovate/') && !startsWith(github.head_ref, 'renovate/') }}
